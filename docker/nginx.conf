# Markdown Viewer is HTTP-only inside Docker. HTTPS is provided by Caddy.
server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Only SPA routes may fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Unversioned scripts and styles should revalidate after an image upgrade.
    # Do not define add_header in these locations: preserve inherited security headers.
    location ~* \.(js|css)$ {
        expires -1;
        try_files $uri =404;
    }

    # nginx:alpine does not consistently map .mjs to a JavaScript MIME type.
    location ~* \.mjs$ {
        types { application/javascript mjs; }
        default_type application/javascript;
        expires -1;
        try_files $uri =404;
    }

    # Short, bounded cache for unversioned image/font assets.
    location ~* \.(png|jpe?g|gif|ico|svg|webp|woff2?)$ {
        expires 7d;
        try_files $uri =404;
    }

    # Never expose accidentally copied dotfiles.
    location ~ /\. {
        return 404;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Do not use upgrade-insecure-requests on the plain HTTP listener (#290).
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net 'unsafe-inline'; worker-src 'self'; connect-src 'self' https://api.github.com https://raw.githubusercontent.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://kroki.io https://www.plantuml.com https://mermaid.ink https://paulrosen.github.io; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; font-src 'self' data: https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; media-src 'self' blob: data:; manifest-src 'self'" always;
}
