# HTTP-only Markdown Viewer.
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/snippets/security-headers.conf;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Stable code filenames change between releases; do not cache immutably.
    location = /sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }
    location ~* \.mjs$ {
        types { application/javascript mjs; }
        default_type application/javascript;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }
    location ~* \.(js|css|json|md|html)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }
    location ~* \.(png|jpe?g|gif|ico|svg|webp|woff2?)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }
    location / {
        # Always revalidate the unversioned editor shell on online navigation.
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
