# Optional local HTTPS: https://localhost:8443 (self-signed local CA).
# The Nginx application has no published host HTTP port in this mode.
services:
  markdown-viewer:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "80"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    depends_on:
      - markdown-viewer
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - ./docker/Caddyfile.local:/etc/caddy/Caddyfile:ro
      - mdv_caddy_data:/data
      - mdv_caddy_config:/config
    restart: unless-stopped

volumes:
  mdv_caddy_data:
  mdv_caddy_config:
