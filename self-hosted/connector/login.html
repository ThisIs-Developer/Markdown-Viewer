<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Markdown Viewer — Self-hosted sign in</title><style>body{background:#161b22;color:#e6edf3;font:16px system-ui;max-width:420px;margin:12vh auto;padding:24px}label,input,button{display:block;width:100%;box-sizing:border-box;margin:12px 0}input,button{padding:12px;border-radius:6px;border:1px solid #46505c;background:#21262d;color:inherit}button{cursor:pointer;color:#80baff}small,p{color:#acb6c2}#status{color:#ff9b9b}</style><script src="/login.js" defer></script></head><body><h1>Markdown Viewer</h1><p>Sign in to your self-hosted installation.</p><form><label>Username<input name="username" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button>Sign in</button></form><p id="status" role="status"></p><small>Use a separate browser profile on shared devices. Local documents remain in this browser. This installation has one owner.</small></body></html>
